name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Fail fast before any expensive build if the tag and the two version sources
  # disagree, and prepare the release body from CHANGELOG.md.
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version alignment
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          CONF="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO="$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$TAG  package.json=$PKG  tauri.conf.json=$CONF  Cargo.toml=$CARGO"
          FAIL=0
          [ "$TAG" = "$PKG" ]   || { echo "::error::tag ($TAG) != package.json ($PKG)"; FAIL=1; }
          [ "$TAG" = "$CONF" ]  || { echo "::error::tag ($TAG) != tauri.conf.json ($CONF)"; FAIL=1; }
          [ "$TAG" = "$CARGO" ] || { echo "::error::tag ($TAG) != Cargo.toml ($CARGO)"; FAIL=1; }
          [ "$FAIL" = "0" ] || exit 1
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SECTION="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba}')"
          if [ -z "$SECTION" ]; then
            SECTION="See [\`CHANGELOG.md\`](https://github.com/CanReader/brew-focus/blob/main/CHANGELOG.md) for details."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "## What's new in ${GITHUB_REF_NAME}"
            echo ""
            echo "$SECTION"
            echo ""
            echo "---"
            echo "🍺 Full changelog: https://github.com/CanReader/brew-focus/blob/main/CHANGELOG.md"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb,rpm'
          - platform: windows-latest
            args: '--bundles nsis,msi'
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Brew Focus ${{ github.ref_name }}'
          releaseBody: ${{ needs.preflight.outputs.body }}
          releaseDraft: true
          prerelease: false
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}
