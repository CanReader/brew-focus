name: Release

# v1.2.3 -> draft release. v1.2.3-beta.1 / -rc.1 -> draft pre-release, which the
# updater ignores (it only reads releases/latest), so it's safe for testers.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Fail fast before any expensive build if the tag and the two version sources
  # disagree, and prepare the release body from CHANGELOG.md.
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Without these the build has no backend and just shows the config error screen.
      - name: Check required secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          FAIL=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "${!name}" ] || { echo "::error::secret $name is not set"; FAIL=1; }
          done
          exit $FAIL

      - name: Verify version alignment
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG%%-*}" # v1.2.3-beta.1 builds 1.2.3
          PKG="$(node -p "require('./package.json').version")"
          CONF="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO="$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$TAG  package.json=$PKG  tauri.conf.json=$CONF  Cargo.toml=$CARGO"
          FAIL=0
          [ "$TAG" = "$PKG" ]   || { echo "::error::tag ($TAG) != package.json ($PKG)"; FAIL=1; }
          [ "$TAG" = "$CONF" ]  || { echo "::error::tag ($TAG) != tauri.conf.json ($CONF)"; FAIL=1; }
          [ "$TAG" = "$CARGO" ] || { echo "::error::tag ($TAG) != Cargo.toml ($CARGO)"; FAIL=1; }
          [ "$FAIL" = "0" ] || exit 1
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SECTION="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba}')"
          if [ -z "$SECTION" ]; then
            SECTION="See [\`CHANGELOG.md\`](https://github.com/CanReader/brew-focus/blob/main/CHANGELOG.md) for details."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "## What's new in ${GITHUB_REF_NAME}"
            echo ""
            echo "$SECTION"
            echo ""
            echo "---"
            echo "🍺 Full changelog: https://github.com/CanReader/brew-focus/blob/main/CHANGELOG.md"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb,rpm'
          - platform: windows-latest
            args: '--bundles nsis,msi'
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # strip stray line breaks in case the key was pasted wrapped
      - name: Clean up updater key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          KEY="$(printf %s "$SIGNING_KEY" | tr -d '\r\n ')"
          echo "::add-mask::$KEY"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"

      # Code signing is optional: if the secrets aren't there the build still goes
      # out, just unsigned (SmartScreen / Gatekeeper warnings).
      - name: Set up macOS signing
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE not set, macOS build will be unsigned"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done

      - name: Set up Windows signing
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "::warning::WINDOWS_CERTIFICATE not set, Windows build will be unsigned"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $conf = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 5
          $confPath = Join-Path $env:RUNNER_TEMP 'sign.windows.json'
          Set-Content -Path $confPath -Value $conf
          "SIGN_ARGS=--config $confPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Brew Focus ${{ github.ref_name }}'
          releaseBody: ${{ needs.preflight.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }} ${{ env.SIGN_ARGS }}
