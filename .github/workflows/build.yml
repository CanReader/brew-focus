name: Build

# Full installers without making a release. Download them from the run's
# artifacts to test before promoting staging -> main.
#   - every push to staging
#   - any tag starting with build- (e.g. build-new-timer), on any branch
#   - weekly on main, so we notice when a full bundle stops building
#   - by hand from the Actions tab, on any branch
on:
  push:
    branches: [staging]
    tags: ['build-*']
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb'
          - platform: windows-latest
            args: '--bundles nsis'
          - platform: macos-latest
            args: '--bundles app,dmg'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # Signing key is needed because createUpdaterArtifacts is on. Supabase env
      # so the build actually talks to the backend when you test it.
      - name: Build
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # The stored key was copied out of a terminal, so it has line breaks and
          # the "%" zsh prints when output has no trailing newline. Strip both.
          KEY="$(printf %s "$SIGNING_KEY" | tr -d '\r\n ')"
          export TAURI_SIGNING_PRIVATE_KEY="${KEY%\%}"
          npx tauri build ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: brew-focus-build-${{ github.run_number }}-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error
          retention-days: 14
