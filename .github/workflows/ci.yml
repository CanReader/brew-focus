name: CI

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  # no paths-ignore here: with required checks on, a docs-only PR would wait forever
  pull_request:
    branches: [main, staging]

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Check locale keys
        run: npm run check:locales

      - name: Check versions match
        run: node scripts/check-version.mjs

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

  # Only on staging -> main PRs: a version bump needs a dated changelog entry.
  release-gate:
    name: Version / changelog
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and changelog
        run: node scripts/check-version.mjs --base origin/main

  # macOS isn't worth running on every PR, but it should never reach main broken.
  macos:
    name: macOS build
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app bundle (debug)
        run: npx tauri build --debug --bundles app

  audit:
    name: Dependency audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # ignores live in src-tauri/.cargo/audit.toml
      - name: cargo audit
        working-directory: ./src-tauri
        run: cargo audit

  rust:
    name: Rust (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # generate_context! embeds frontendDist (../dist) at compile time, so the
      # Rust checks need the built frontend to exist first.
      - name: Build frontend (required for tauri context)
        run: |
          npm ci
          npm run build

      - name: Check formatting
        working-directory: ./src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: ./src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo check
        working-directory: ./src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: ./src-tauri
        run: cargo test
